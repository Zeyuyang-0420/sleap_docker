[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/sleap/supervisord.pid
childlogdir=/run/sleap

[supervisorctl]
serverurl=unix:///run/sleap/supervisor.sock

[unix_http_server]
file=/run/sleap/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -nolisten tcp -ac +extension GLX +render -noreset
user=sleap
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/local/bin/wait-for-display.sh dbus-run-session openbox-session
user=sleap
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/bin/wait-for-display.sh x11vnc -display :1 -rfbauth /run/sleap/vnc.pass -forever -shared -rfbport 5900 -localhost -noxdamage -repeat -quiet
user=sleap
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
user=sleap
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sleap-gui]
command=/usr/local/bin/wait-for-display.sh /opt/venv/bin/sleap
directory=/data
user=sleap
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jupyterlab]
command=/opt/venv/bin/jupyter lab --config=/etc/sleap/jupyter_server_config.py
directory=/data
user=sleap
priority=60
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

